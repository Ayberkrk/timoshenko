[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timoshenko-engine"
version = "2.0.0"
description = "Composable structural engineering calculations and analysis primitives for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.24"]
authors = [{ name = "Timoshenko contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
test = ["pytest>=7"]

[project.entry-points."timoshenko.plugins"]
mqtt = "timoshenko.mqtt:MqttPlugin"
sensorthings = "timoshenko.sensorthings:SensorThingsPlugin"

[project.urls]
Repository = "https://github.com/Ayberkrk/timoshenko"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
