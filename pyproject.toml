[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timoshenko-engine"
version = "2.1.0a1"
description = "Composable structural engineering calculations and analysis primitives for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
authors = [{ name = "Ayberk Korkmaz" }]
keywords = [
  "civil engineering",
  "structural engineering",
  "structural health monitoring",
  "modal analysis",
  "digital twin",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
test = ["pytest>=7"]

[project.entry-points."timoshenko.plugins"]
mqtt = "timoshenko.mqtt:MqttPlugin"
sensorthings = "timoshenko.sensorthings:SensorThingsPlugin"

[project.urls]
Homepage = "https://github.com/Ayberkrk/timoshenko"
Repository = "https://github.com/Ayberkrk/timoshenko"
Issues = "https://github.com/Ayberkrk/timoshenko/issues"
Documentation = "https://github.com/Ayberkrk/timoshenko/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
