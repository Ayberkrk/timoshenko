[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timoshenko-engine"
version = "2.0.2"
description = "Composable structural engineering calculations and analysis primitives for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24"]
authors = [{ name = "Ayberk Korkmaz" }]
keywords = [
  "civil engineering",
  "structural engineering",
  "structural health monitoring",
  "modal analysis",
  "digital twin",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.1,<3"]
test = ["pytest>=7", "pytest-cov>=5"]
lint = ["ruff>=0.6", "mypy>=1.10"]
docs = ["mkdocs-material>=9.5,<10"]

[project.entry-points."timoshenko.plugins"]
mqtt = "timoshenko.mqtt:MqttPlugin"
sensorthings = "timoshenko.sensorthings:SensorThingsPlugin"

[project.urls]
Homepage = "https://github.com/Ayberkrk/timoshenko"
Repository = "https://github.com/Ayberkrk/timoshenko"
Issues = "https://github.com/Ayberkrk/timoshenko/issues"
Documentation = "https://timoshenko-engine.readthedocs.io/"
Changelog = "https://github.com/Ayberkrk/timoshenko/blob/main/docs/changelog.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
timoshenko = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
source = ["timoshenko"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["src/timoshenko"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
