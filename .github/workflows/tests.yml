name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[lint]"
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  pytest-os:
    # The full Python matrix runs on Ubuntu; this checks the file, path and
    # SQLite handling on the other two platforms with a single version.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timoshenko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d timoshenko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIMOSHENKO_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/timoshenko_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,postgres]"
      - run: python -m pytest tests/test_postgres_store.py -q

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: timoshenko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d timoshenko_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TIMOSHENKO_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/timoshenko_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,postgres]"
      - run: python -m pytest --cov --cov-report=term
      # Stores the badge on the python-coverage-comment-action-data branch.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ github.token }}
          MINIMUM_GREEN: 85
          MINIMUM_ORANGE: 70
