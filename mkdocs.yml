site_name: Timoshenko Engine
site_description: Reusable structural engineering building blocks for Python applications.
repo_url: https://github.com/Ayberkrk/timoshenko
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Start here:
      - Architecture: architecture.md
      - API reference: api.md
      - Numerical methods: numerical-methods.md
  - Modal analysis and monitoring:
      - Data contract: data-contract.md
      - Live sessions: live-sessions.md
      - Project manifests: project-manifest.md
      - Reports: reporting.md
  - Data sources and storage:
      - Source adapters: adapters.md
      - Plugin contract: plugin-contract.md
      - CSV replay: csv-source.md
      - MQTT: mqtt-adapter.md
      - OGC SensorThings: sensorthings-adapter.md
      - Local storage: storage.md
  - Engineering calculations:
      - Section properties: section-properties.md
      - Polygon sections: polygon-sections.md
      - Rayleigh damping: rayleigh-damping.md
      - Uncertainty: uncertainty.md
  - Project:
      - Changelog: changelog.md
      - Literature review: literature-review.md
      - Cauren integration: cauren-integration.md
      - Publishing and citation: publishing.md
